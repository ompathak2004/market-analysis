services:
  migrate:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file: .env
    command: ["node", "node_modules/@ma/db/dist/migrate.js"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file: .env
    environment:
      API_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file: .env
    command: ["node", "dist/worker/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_URL: http://api:4000
      API_KEY: ${API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
